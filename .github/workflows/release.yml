# Builds on every push/PR (artifact), publishes a GitHub Release on tags v*.
name: release
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    uses: hervad/w11-cursor-toolkit/.github/workflows/build-theme.yml@v0.1.0
    with:
      toolkit-ref: v0.1.0
      # Upstream is a vendored tarball: verify its SHA-256 and extract the SVG master (same command as locally).
      # Needs a toolkit tag that includes `w11cursor unpack` (v0.1.0 and later).
      pre-build: w11cursor unpack theme.toml
    permissions:
      contents: write
