# ─────────────────────────────────────────────────────────────────────────────
# theme.toml - the ONLY build input of a theme repo. Read by `w11cursor`.
# Fill every TODO, then:  w11cursor build theme.toml && w11cursor validate theme.toml
# ─────────────────────────────────────────────────────────────────────────────
schema = 1

[theme]
slug        = "polar"               # used in zip names: <slug>-<variant>-w11-hidpi-v<version>.zip
name        = "Polar Cursor Theme"
version     = "0.1.0"                   # YOUR port version (tag v0.1.0 to release)
license     = "GPL-2.0-or-later"     # author notice COPYRIGHT (shipped upstream as COPYRIGHT~), full text in LICENSE
porter      = "Vadym Herman (hervad)"
description = "Polar Cursor Theme 1.4 (orange/blue/green busy)"

[upstream]                              # provenance - copied into README/CREDITS, also documents the pin
kind    = "tarball"                         # git | tarball
url     = "https://www.gnome-look.org/p/999968 (27913-PolarCursorThemes.tar.bz2, downloaded 2026-10-07)"
# The ORIGINAL tarball is committed unchanged (GPL corresponding source). Before building, locally and in CI:
#   w11cursor unpack theme.toml   -> checks sha256, extracts only `extract` into `into` (git-ignored)
archive = "upstream/27913-PolarCursorThemes.tar.bz2"
sha256  = "03d77c528c89f507eb240d4efd2dfcb0b5d8245cd20c94f9cf8a87e50c16f598"
extract = ["PolarCursorTheme/Source/Cursors.svg"]
into    = "build/upstream"
authors = ["Eric Matthews (ECHM)"]
license = "GPL-2.0-or-later (author notice COPYRIGHT~, identical in all 3 variants)"
page    = "https://www.gnome-look.org/p/999968"

[render]
renderer      = "cairosvg"
design_canvas = 32       # measured: Cursors.svg is 32x32 and every upstream .conf uses size 32;
                         # hotspots below are in THIS space.
hotspot_mode  = "point"  # "point": geometric SVG point (arrow tips). "center": middle of a design pixel.

[sizes]                  # omit the whole table to use toolkit defaults (recommended until the probe says otherwise)
# static           = [32, 40, 48, 56, 64, 72, 80, 96, 112, 128, 144, 160, 192, 224, 256]
# animated         = [32, 40, 48, 64, 80, 96, 128]
# ani_budget_bytes = 1000000
# ani_chunk_order  = ["anih", "LIST", "rate"]
# png_min_size     = 1   # 256 = BMP below 256 px (fallback if a PNG layer is ever rejected)

# ONE Inkscape master; each cursor names its layers (ADR-13). Extracted unchanged by `w11cursor unpack`.
[source]
master = "build/upstream/PolarCursorTheme/Source/Cursors.svg"

# Only variants on the gnome-look page: orange (default), blue, green. They differ ONLY in the spinner
# bar colour; Blue/Green rotate the bar's hue (+180 / +74 deg) measured from the upstream PNGs
# (w11-cursor-toolkit docs/LAYER_SPLITTING_DESIGN.md section 6). Both hex values occur exactly once in the master.
[[variants]]
id          = "orange"
scheme_name = "Polar W11 HiDPI"

[[variants]]
id          = "blue"
scheme_name = "Polar Blue W11 HiDPI"
recolor     = { "#ff5e13" = "#13b3ff", "#912121" = "#219191" }

[[variants]]
id          = "green"
scheme_name = "Polar Green W11 HiDPI"
recolor     = { "#ff5e13" = "#7cff13", "#912121" = "#769121" }

# ── Windows roles (all 17). Layers = inkscape:label in the master; hotspots from upstream *.conf
#    (design space 32). Mapping evidence (IoU vs upstream PNGs): w11-cursor-toolkit docs/LAYER_SPLITTING_DESIGN.md section 1.
[cursors.arrow]        # Normal Select        upstream Arrow.conf
layers  = ["Arrow"]
hotspot = [0, 0]

[cursors.help]         # Help Select          upstream Help.conf (Arrow + "?" badge)
layers  = ["Arrow", "Info"]
hotspot = [0, 0]

[cursors.working]      # Working in Background  upstream AppStarting.conf: 18 frames x 60 ms
layers      = ["Arrow", "AppSpinner"]
rotate      = { id = "g13479", center = [16.422, 16.421], step_deg = 10 }   # bar only, clockwise
frame_count = 18
delay       = [4, 3, 4, 3, 4, 4, 3, 4, 3, 4, 4, 3, 4, 3, 4, 4, 3, 4]       # 65 jiffies = 1,083 ms (orig 1,080)
hotspot     = [0, 0]

[cursors.busy]         # Busy                 upstream Wait.conf: 18 frames x 60 ms
layers      = ["Spinner"]
rotate      = { id = "g12727", center = [16.422, 16.421], step_deg = 10 }
frame_count = 18
delay       = [4, 3, 4, 3, 4, 4, 3, 4, 3, 4, 4, 3, 4, 3, 4, 4, 3, 4]
hotspot     = [10, 10]

[cursors.precision]    # Precision Select     upstream Crosshair.conf
layers  = ["Crosshair"]
hotspot = [11, 11]

[cursors.text]         # Text Select          upstream IBeam.conf (layer "Caret")
layers  = ["Caret"]
hotspot = [5, 9]

[cursors.handwriting]  # Handwriting          upstream Handwriting.conf
layers  = ["Pencil"]
hotspot = [0, 20]

[cursors.unavailable]  # Unavailable          upstream NO.conf
layers  = ["Circle"]
hotspot = [11, 11]

[cursors.vert]         # Vertical Resize      upstream SizeNS.conf
layers  = ["NS"]
hotspot = [5, 12]

[cursors.horz]         # Horizontal Resize    upstream SizeWE = NS transposed (x<->y), IoU 1.00
layers    = ["NS"]
transform = "matrix(0 1 1 0 0 0)"
hotspot   = [12, 5]

[cursors.dgn1]         # Diagonal Resize 1 = NW-SE: NS rotated -45 deg about its centre (5.65, 12.65),
layers    = ["NS"]     # centre placed exactly on the hotspot (9, 9)
transform = "translate(9 9) rotate(-45) translate(-5.65 -12.65)"
hotspot   = [9, 9]

[cursors.dgn2]         # Diagonal Resize 2 = NE-SW: NS rotated +45 deg, same centre
layers    = ["NS"]
transform = "translate(9 9) rotate(45) translate(-5.65 -12.65)"
hotspot   = [9, 9]

[cursors.move]         # Move                 upstream SizeAll.conf (layer "Fleur")
layers  = ["Fleur"]
hotspot = [12, 12]

[cursors.alternate]    # Alternate Select     upstream UpArrow.conf
layers  = ["ArrowUP"]
hotspot = [6, 0]

[cursors.link]         # Link Select          upstream Hand.conf (HandPointer.png)
layers  = ["Hand Pointer"]
hotspot = [5, 0]

[cursors.pin]          # Location Select: upstream has none; Windows' own Pin/Person are hand variants.
same_as = "link"       # v1 stand-in (README). Badges may come later as overrides/_all/pin.svg.

[cursors.person]       # Person Select: same story.
same_as = "link"
